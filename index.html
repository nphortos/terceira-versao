    <script>
        /* Movimento delicado do fundo conforme a rolagem, respeitando acessibilidade. */
        (() => {
            if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            let pending = false;
            const update = () => {
                const y = Math.max(-42, -Math.min(42, window.scrollY * 0.055));
                document.body.style.setProperty('--naporta-parallax', y.toFixed(1) + 'px');
                pending = false;
            };
            window.addEventListener('scroll', () => {
                if (!pending) {
                    pending = true;
                    requestAnimationFrame(update);
                }
            }, {
                passive: true
            });
            update();
        })();
    </script>
</body>
